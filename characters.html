<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>인물 · 검과 마나의 경계</title>
<meta name="theme-color" content="#0B0D10">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<a class="skip" href="#main">본문으로</a>
<header class="hd">
  <a class="logo" href="characters.html">검과 마나의 경계</a>
  <nav aria-label="주 메뉴"><a href="characters.html" aria-current="page">인물</a></nav>
</header>
<main id="main">
<section class="select" data-select data-side="east">
  <aside class="roster">
    <div class="filters" role="tablist" aria-label="진영 필터">
      <button type="button" role="tab" data-f="all" aria-selected="true">전체</button>
      <button type="button" role="tab" data-f="east" aria-selected="false">동방</button>
      <button type="button" role="tab" data-f="west" aria-selected="false">서방</button>
      <button type="button" role="tab" data-f="neutral" aria-selected="false">중립</button>
    </div>
    <ol class="list" role="listbox" aria-label="인물 명단"></ol>
  </aside>
  <div class="stage sel-stage">
    <img alt="" decoding="async" fetchpriority="high"><img alt="" decoding="async">
    <p class="noimg" hidden>이미지 없음</p>
    <div class="shade"></div>
    <div class="sel-info">
      <p class="alias"></p>
      <h1 class="name"></h1>
      <p class="meta"></p>
      <a class="cta" href="#">상세 보기 <kbd>Enter</kbd></a>
    </div>
  </div>
</section>
</main>
<script src="assets/data.js"></script>
<script src="assets/main.js"></script>
</body>
</html>
